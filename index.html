<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4FB3E8">
<meta name="description" content="A pixel-art plane game over Cape Town. Fly low, skim the rooftops, and score on clearance. Built with Three.js.">
<meta property="og:title" content="Plaine Game">
<meta property="og:description" content="A pixel-art plane game over Cape Town. Low is good.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9992;</text></svg>">
<title>Plaine Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{
  --sky:#4FB3E8;
  --ink:#0B0F14;
  --panel:#12212E;
  --cream:#F5F0E6;
  --orange:#E8632A;
  --lime:#D6E84C;
  --red:#E23B2E;
  --px:"Press Start 2P","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:#fff;overflow:hidden;font-family:var(--px);
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}

.out{text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),
  2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink)}
.box{border:3px solid var(--ink)}

#ui{position:fixed;inset:0;z-index:3;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between}

/* ---------- top row ---------- */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;
  gap:10px;padding:14px 16px 0}
.top-l{display:flex;align-items:flex-start;gap:18px}
.top-r{display:flex;align-items:flex-start;justify-content:flex-end;gap:18px}

#mute{pointer-events:auto;cursor:pointer;width:46px;height:46px;flex:none;
  background:var(--orange);border:3px solid var(--ink);color:#fff;font-family:var(--px);
  font-size:15px;line-height:1;padding:0;display:grid;place-items:center}
#mute.off{background:#7C8A96}
#mute:active{transform:translate(2px,2px)}

.stat{line-height:1}
.stat .k{font-size:9px;color:#fff;letter-spacing:.04em}
.stat .v{font-size:clamp(18px,3.2vw,30px);margin-top:7px;letter-spacing:.02em}

.marquee{background:var(--panel);border:3px solid var(--ink);padding:9px 18px 10px;
  text-align:center;min-width:min(300px,60vw)}
.marquee .a{font-size:11px;color:var(--lime)}
.marquee .b{font-size:8px;color:#CFE0EA;margin-top:7px}

#dvc{width:56px;height:56px;flex:none;background:var(--lime);border:3px solid var(--ink);
  display:grid;place-items:center;text-align:center;line-height:1.25;
  font-size:9px;color:var(--ink)}
#dvc b{display:block;font-size:14px;font-weight:400}

.chips{display:flex;gap:10px;justify-content:center;margin-top:12px}
.chip{background:var(--cream);border:3px solid var(--ink);color:var(--ink);
  font-size:9px;padding:8px 12px;display:flex;gap:9px;align-items:center;line-height:1}
.chip[hidden]{display:none}
.chip i{font-style:normal;color:var(--orange)}
.chip.hot i{color:var(--red)}
.chip.x2{background:var(--lime)}

/* ---------- bottom ---------- */
.bottom{padding:0 0 0}
.hint{text-align:center;font-size:clamp(13px,2.6vw,22px);padding-bottom:20px;
  animation:blink 1.15s steps(2,end) infinite}
.hint[hidden]{display:none}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.28}}
@media (prefers-reduced-motion:reduce){.hint{animation:none}}

.strip{background:var(--ink);display:flex;justify-content:space-between;
  padding:8px 14px;font-size:8px;color:#8FA6B4;gap:10px}
.strip span:nth-child(2){color:var(--lime)}

/* ---------- game over ---------- */
#over{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:18px;
  background:rgba(11,15,20,.55)}
#over[hidden]{display:none}
.panel{position:relative;width:min(430px,100%);background:var(--panel);
  border:4px solid var(--ink);padding:26px 24px 24px;text-align:center;
  box-shadow:0 0 0 4px rgba(255,255,255,.10)}
.panel h1{margin:0;font-size:clamp(19px,4.4vw,27px);color:var(--orange);line-height:1.35}
.panel .sub{font-size:9px;color:#CFE0EA;line-height:1.85;margin:16px 0 0}
.rows{margin:20px 0;border:3px solid var(--ink);background:#0B1621}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;font-size:9px;
  color:#9FB6C6;border-bottom:2px solid #16283A}
.row:last-child{border-bottom:0}
.row b{color:#fff;font-weight:400}
.row b.lime{color:var(--lime)}
.btn{pointer-events:auto;cursor:pointer;font-family:var(--px);font-size:12px;color:#fff;
  background:var(--orange);border:3px solid var(--ink);padding:14px 22px;width:100%;
  box-shadow:0 4px 0 #A8421A}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #A8421A}
.btn:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.pb{position:absolute;top:-20px;right:-14px;background:var(--lime);color:var(--ink);
  border:3px solid var(--ink);font-size:9px;padding:8px 10px;transform:rotate(7deg)}
.pb[hidden]{display:none}

@media (max-width:620px){
  .top{padding:10px 10px 0;gap:6px}
  .top-l,.top-r{gap:9px}
  .stat .k{font-size:7px}
  .marquee{padding:7px 10px 8px;min-width:0}
  .marquee .a{font-size:9px}
  .marquee .b{font-size:6px}
  #mute{width:36px;height:36px;font-size:12px}
  #dvc{width:42px;height:42px;font-size:7px}
  #dvc b{font-size:11px}
  .chip{font-size:7px;padding:6px 8px}
  .strip{font-size:6px;padding:6px 8px}
}
</style>
<style>[hidden]{display:none!important}</style>
</head>
<body>

<div id="stage"></div>

<div id="ui">
  <div>
    <div class="top">
      <div class="top-l">
        <button id="mute" type="button" aria-label="Toggle sound">&#9835;</button>
        <div class="stat out"><div class="k">SCORE</div><div class="v" id="score">00000</div></div>
      </div>

      <div>
        <div class="marquee">
          <div class="a" id="mqA">LOW IS GOOD</div>
          <div class="b" id="mqB">HIT SPACE OR TAP</div>
        </div>
        <div class="chips">
          <div class="chip"><span>CLEARED</span><i id="cleared">0</i></div>
          <div class="chip" id="clrChip"><span>CLEARANCE</span><i id="clearance">&mdash;</i></div>
          <div class="chip x2" id="x2Chip" hidden><span>WINGMAN</span><i>x2</i></div>
        </div>
      </div>

      <div class="top-r">
        <div class="stat out" style="text-align:right"><div class="k">BEST</div><div class="v" id="best">00000</div></div>
        <div id="dvc">DIE<b>VC</b></div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="hint out" id="hint">SPACE / TAP TO FLAP</div>
    <div class="strip">
      <span>DIE VAN COLLERS</span>
      <span>LOW IS GOOD</span>
      <span>PLAINE GAME</span>
    </div>
  </div>
</div>

<div id="over" hidden>
  <div class="panel">
    <div class="pb" id="pb" hidden>NEW<br>BEST</div>
    <h1 id="ovTitle">DOWN IN THE STREETS</h1>
    <p class="sub" id="ovSub"></p>
    <div class="rows">
      <div class="row"><span>SCORE</span><b id="ovScore">0</b></div>
      <div class="row"><span>CLEARED</span><b id="ovCleared">0</b></div>
      <div class="row"><span>CLOSEST PASS</span><b class="lime" id="ovClosest">0.0 M</b></div>
      <div class="row"><span>BEST</span><b id="ovBest">0</b></div>
    </div>
    <button class="btn" id="again" type="button">FLY AGAIN</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var BANNER_TEXT = "DIE VAN COLLERS";
  var PFONT = '"Press Start 2P", monospace';

  /* palette lifted from the reference art */
  var P = {
    sky:"#4FB3E8", skyHaze:"#7FCBEE",
    rock:"#BCAB8E", rockHi:"#DACDB2", rockMid:"#93826A", rockShade:"#657992",
    rockDeep:"#4B5F7C", red:"#E23B2E",
    grn:"#4E9E3E", grnHi:"#6FC44F", grnDk:"#2F7A2A", grnDeep:"#1F5C1E",
    grass:"#55A83F", grassHi:"#79C755", grassDk:"#3A8430",
    sand:"#E8D08A", sandDk:"#C4A85E",
    sea:"#1C5B8C", seaHi:"#2F7EB4",
    stone:"#E4E0D6", stoneDk:"#B9B4A8", stoneSh:"#8E8A80",
    glass:"#2E5B7A", glassHi:"#4A83A8",
    maroon:"#8E2A38", maroonDk:"#651C28",
    body:"#22303F", bodyHi:"#39506B", cream:"#F5F0E6", ink:"#0B0F14",
    orange:"#E8632A", lime:"#D6E84C", gold:"#F2C230", goldHi:"#FFE27A",
    wood:"#8A5A32", woodDk:"#5E3C1E", white:"#FFFFFF",
    pastel:["#E8C9A8","#C9D6DD","#F0D9B8","#B8C4CC","#E8A890","#DCE4E8","#EFCFB2","#AEC0CC"]
  };

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function ri(a, b) { return Math.floor(rnd(a, b + 1)); }
  function pick(a) { return a[(Math.random() * a.length) | 0]; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  /* ---------------------------------------------------- pixel canvas kit */
  function C(w, h) {
    var c = document.createElement("canvas");
    c.width = w; c.height = h;
    var g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    return { c: c, g: g, w: w, h: h };
  }
  function R(o, x, y, w, h, col) { o.g.fillStyle = col; o.g.fillRect(x | 0, y | 0, w | 0, h | 0); }
  /* chunky blob: a rect with the four corner pixels cut, the pixel-art way */
  function blob(o, x, y, w, h, col, cut) {
    cut = cut || 1;
    R(o, x + cut, y, w - cut * 2, h, col);
    R(o, x, y + cut, w, h - cut * 2, col);
  }
  function dither(o, x, y, w, h, col, odd) {
    o.g.fillStyle = col;
    for (var j = 0; j < h; j++) for (var i = 0; i < w; i++)
      if (((i + j) & 1) === (odd ? 1 : 0)) o.g.fillRect((x + i) | 0, (y + j) | 0, 1, 1);
  }
  function tex(o) {
    var t = new THREE.CanvasTexture(o.c);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestFilter;
    t.generateMipmaps = false;
    return t;
  }

  var redraws = [];
  function pixText(o, txt, x, y, size, col, align) {
    var g = o.g;
    g.font = size + 'px ' + PFONT;
    g.textAlign = align || "left";
    g.textBaseline = "top";
    g.fillStyle = col;
    g.fillText(txt, x | 0, y | 0);
  }

  /* -------------------------------------------------------- the renderer */
  var stage = $("#stage");
  var renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(P.sky);
  var camera = new THREE.OrthographicCamera(0, 480, 270, 0, -100, 100);
  var VW = 480, VH = 270;
  var rt = null, post = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  var quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial());
  post.add(quad);

  function resize() {
    var iw = window.innerWidth, ih = window.innerHeight, a = iw / ih;
    if (a >= 1.15) { VH = 270; VW = Math.round(VH * a); if (VW > 760) { VW = 760; VH = Math.round(VW / a); } }
    else { VW = 340; VH = Math.round(VW / a); if (VH > 700) { VH = 700; VW = Math.round(VH * a); } }
    camera.left = 0; camera.right = VW; camera.top = VH; camera.bottom = 0;
    camera.updateProjectionMatrix();
    renderer.setSize(iw, ih);
    if (rt) rt.dispose();
    rt = new THREE.WebGLRenderTarget(VW, VH, {
      minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
      format: THREE.RGBAFormat, depthBuffer: false, stencilBuffer: false
    });
    quad.material.map = rt.texture;
    quad.material.needsUpdate = true;
    layout();
  }

  function makeSprite(o, order) {
    var m = new THREE.Mesh(new THREE.PlaneGeometry(o.w, o.h), new THREE.MeshBasicMaterial({
      map: tex(o), transparent: true, depthTest: false, depthWrite: false
    }));
    m.renderOrder = order;
    m.userData.w = o.w; m.userData.h = o.h; m.userData.src = o;
    scene.add(m);
    return m;
  }
  /* place by bottom-left corner, snapped to the pixel grid */
  function put(m, x, y) {
    m.position.set(Math.round(x) + m.userData.w / 2, Math.round(y) + m.userData.h / 2, 0);
  }

  /* column heights above the sprite's bottom edge, read straight from its alpha */
  function profileOf(o) {
    var d = o.g.getImageData(0, 0, o.w, o.h).data;
    var prof = new Int16Array(o.w);
    for (var x = 0; x < o.w; x++) {
      var top = -1;
      for (var y = 0; y < o.h; y++) {
        if (d[(y * o.w + x) * 4 + 3] > 128) { top = y; break; }
      }
      prof[x] = top < 0 ? -9999 : (o.h - top);
    }
    return prof;
  }

  /* ============================================================== ART ==== */
  var LAND_W = 960;   /* width of the wrapping background bands */

  /* ---- Table Mountain, Devil's Peak and Lion's Head --------------------- */
  function mountainArt() {
    var W = LAND_W, H = 150, o = C(W, H);
    var top = new Int16Array(W), grn = new Int16Array(W);
    for (var x = 0; x < W; x++) {
      var p = x / W, t;
      if (p < 0.05) t = lerp(132, 104, p / 0.05);
      else if (p < 0.11) t = lerp(104, 62, (p - 0.05) / 0.06);
      else if (p < 0.17) t = lerp(62, 26, (p - 0.11) / 0.06);
      else if (p < 0.68) t = 24 + Math.sin(p * 44) * 1.6 + Math.sin(p * 9 + 1) * 2.2;
      else if (p < 0.74) t = lerp(24, 58, (p - 0.68) / 0.06);
      else if (p < 0.79) t = lerp(58, 34, (p - 0.74) / 0.05);      /* Devil's Peak */
      else if (p < 0.86) t = lerp(34, 88, (p - 0.79) / 0.07);
      else if (p < 0.91) t = lerp(88, 52, (p - 0.86) / 0.05);      /* Lion's Head */
      else t = lerp(52, 140, (p - 0.91) / 0.09);
      top[x] = Math.round(t);
      grn[x] = Math.round(t + 44 + Math.sin(x * 0.05) * 5 + Math.sin(x * 0.017) * 7);
    }
    /* green lower slopes first, rock painted over them */
    for (x = 0; x < W; x++) {
      R(o, x, grn[x], 1, H - grn[x], P.grn);
      R(o, x, grn[x], 1, 3, P.grnHi);
    }
    for (x = 0; x < W; x += 1) {
      if ((x % 23) < 2) R(o, x, grn[x] + 4, 1, H - grn[x] - 4, P.grnDk);
      if ((x % 61) < 3) R(o, x, grn[x] + 9, 1, H - grn[x] - 9, P.grnDeep);
    }
    dither(o, 0, 0, W, H, P.grnDk, true);
    /* re-cut the sky above the green so the dither doesn't bleed */
    for (x = 0; x < W; x++) o.g.clearRect(x, 0, 1, grn[x]);
    for (x = 0; x < W; x++) { R(o, x, grn[x], 1, 3, P.grnHi); }

    /* the buttressed rock face, band by band */
    var bx = 0, i = 0;
    while (bx < W) {
      var bw = ri(7, 15);
      var tone = [P.rock, P.rockMid, P.rockShade, P.rock, P.rockDeep][i % 5];
      var deep = ri(6, 20);
      for (var xx = bx; xx < Math.min(bx + bw, W); xx++) {
        var yt = top[xx];
        var edge = (xx - bx) / bw;
        var yb = grn[xx] - 2 + Math.round(Math.sin(edge * Math.PI) * deep * 0.5) - (deep >> 2);
        if (yb <= yt + 2) yb = yt + 3;
        R(o, xx, yt, 1, yb - yt, tone);
        if (xx === bx) R(o, xx, yt, 1, yb - yt, P.rockDeep);
      }
      bx += bw; i++;
    }
    /* sunlit cap along the plateau */
    for (x = 0; x < W; x++) {
      R(o, x, top[x], 1, 2, P.rockHi);
      if ((x & 3) === 0) R(o, x, top[x] + 2, 1, 1, P.rockHi);
    }
    return o;
  }

  /* ---- rolling green hills in front of the mountain --------------------- */
  function hillsArt() {
    var W = LAND_W, H = 64, o = C(W, H);
    for (var x = 0; x < W; x++) {
      var t = 26 + Math.sin(x * 0.019) * 9 + Math.sin(x * 0.0067 + 1.4) * 11 + Math.sin(x * 0.05) * 2;
      t = Math.round(t);
      R(o, x, t, 1, H - t, P.grn);
      R(o, x, t, 1, 3, P.grnHi);
      if ((x % 17) < 2) R(o, x, t + 5, 1, H - t - 5, P.grnDk);
    }
    return o;
  }

  /* ---- the small pastel skyline ---------------------------------------- */
  function cityArt() {
    var W = LAND_W, H = 62, o = C(W, H);
    var x = 0;
    while (x < W) {
      var bw = ri(9, 22), bh = ri(16, 46), col = pick(P.pastel);
      var by = H - bh;
      R(o, x, by, bw, bh, col);
      R(o, x + bw - 1, by, 1, bh, "#00000022");
      R(o, x, by, bw, 1, "#FFFFFF55");
      for (var wy = by + 4; wy < H - 4; wy += 5)
        for (var wx = x + 2; wx < x + bw - 2; wx += 4)
          if (Math.random() < 0.86) R(o, wx, wy, 2, 2, "#3E5A6E");
      if (Math.random() < 0.3) R(o, x + 2, by - 3, 2, 3, "#3E5A6E");
      x += bw + ri(0, 5);
    }
    return o;
  }

  /* ---- a row of bushes ------------------------------------------------- */
  function bushRowArt() {
    var W = LAND_W, H = 34, o = C(W, H);
    var x = -4;
    while (x < W) {
      var bw = ri(14, 30), bh = ri(12, 24);
      var by = H - bh;
      blob(o, x, by, bw, bh, P.grnDk, 3);
      blob(o, x + 2, by + 2, bw - 6, bh - 6, P.grn, 2);
      blob(o, x + 4, by + 3, (bw - 10) | 0, 5, P.grnHi, 1);
      x += bw - ri(4, 10);
    }
    return o;
  }

  /* ---- foreground coast: grass, dithered sand, sea ---------------------- */
  var GROUND = 46;
  function coastArt() {
    var W = LAND_W, H = GROUND, o = C(W, H);   /* must exceed the widest viewport to wrap cleanly */
    R(o, 0, 0, W, 30, P.grass);
    R(o, 0, 0, W, 3, P.grassHi);
    dither(o, 0, 4, W, 26, P.grassDk, false);
    for (var x = 0; x < W; x += 7) R(o, x, 3, 1, ri(2, 5), P.grassHi);
    /* zig-zag beach */
    for (x = 0; x < W; x++) {
      var w = 30 + ((x % 8) < 4 ? 0 : 2);
      R(o, x, w, 1, 36 - w, P.sand);
    }
    dither(o, 0, 30, W, 6, P.sandDk, true);
    R(o, 0, 36, W, H - 36, P.sea);
    dither(o, 0, 36, W, 3, P.seaHi, false);
    for (x = 0; x < W; x += 11) R(o, x, 40 + (x % 3), 5, 1, P.seaHi);
    return o;
  }

  /* ---- clouds ---------------------------------------------------------- */
  function cloudArt() {
    var n = ri(3, 5), W = 26 + n * 11, H = 22, o = C(W, H);
    R(o, 3, H - 9, W - 6, 7, P.white);
    for (var i = 0; i < n; i++) {
      var lw = ri(13, 22), lh = ri(9, 15);
      var lx = Math.min(W - lw - 2, 2 + Math.round(i * (W - 14) / n) + ri(-2, 2));
      blob(o, lx, H - 6 - lh, lw, lh, P.white, 2);
    }
    R(o, 4, H - 4, W - 8, 2, "#D6ECF8");
    return o;
  }

  /* ---- aircraft -------------------------------------------------------- */
  function planeArt(bodyCol, trimCol, faceLeft) {
    var W = 48, H = 18, o = C(W, H);
    /* drawn nose-right, mirrored at the end if needed */
    R(o, 8, 6, 30, 7, bodyCol);            /* fuselage */
    R(o, 36, 7, 5, 5, bodyCol);
    R(o, 40, 8, 3, 3, bodyCol);            /* nose */
    R(o, 42, 9, 2, 1, bodyCol);
    R(o, 8, 11, 33, 2, P.cream);           /* belly line */
    R(o, 4, 2, 3, 6, bodyCol);             /* fin */
    R(o, 5, 1, 5, 2, bodyCol);
    R(o, 6, 3, 6, 4, bodyCol);
    R(o, 2, 8, 8, 3, bodyCol);             /* tailplane */

  /* ======================= landmarks you actually fly over =============== */
  function stadiumArt() {
    var W = 214, H = 116, o = C(W, H);
    var cx = W / 2, cy = 40, rx = 104, ry = 32, BH = 44;
    function dy(x) { var d = (x - cx) / rx; return d * d >= 1 ? -1 : Math.sqrt(1 - d * d) * ry; }
    /* facade: the roof's front arc extruded down */
    for (var x = 0; x < W; x++) {
      var v = dy(x); if (v < 0) continue;
      /* the wall runs from the roof's front arc all the way down to the ground */
      var t = Math.round(cy + v), b = H;
      var col = ((x % 6) < 2) ? P.stone : P.glass;
      R(o, x, t, 1, b - t, col);
      if ((x % 6) === 2) R(o, x, t, 1, b - t, P.glassHi);
      R(o, x, t, 1, 3, P.stoneDk);
      R(o, x, H - 4, 1, 4, P.stone);
    }
    /* the roof ring */
    for (x = 0; x < W; x++) {
      var v2 = dy(x); if (v2 < 0) continue;
      var yt = Math.round(cy - v2), yb = Math.round(cy + v2);
      R(o, x, yt, 1, yb - yt, P.stone);
      R(o, x, yt, 1, 2, P.white);
      R(o, x, yb - 2, 1, 2, P.stoneSh);
    }
    /* the opening: seating bowl seen through it */
    var irx = 66, iry = 19;
    for (x = 0; x < W; x++) {
      var d2 = (x - cx) / irx; if (d2 * d2 >= 1) continue;
      var iv = Math.sqrt(1 - d2 * d2) * iry;
      var t2 = Math.round(cy - iv), b2 = Math.round(cy + iv);
      R(o, x, t2, 1, b2 - t2, P.maroon);
      var d3 = (x - cx) / (irx - 14);
      if (d3 * d3 < 1) {
        var iv2 = Math.sqrt(1 - d3 * d3) * (iry - 7);
        R(o, x, Math.round(cy - iv2), 1, Math.round(iv2 * 2), P.maroonDk);
      }
      R(o, x, t2, 1, 2, P.stoneSh);
    }
    /* roof segment ribs */
    for (var a = 0; a < 44; a++) {
      var th = (a / 44) * Math.PI * 2;
      var x1 = cx + Math.cos(th) * (irx + 2), y1 = cy + Math.sin(th) * (iry + 2);
      var x2 = cx + Math.cos(th) * rx, y2 = cy + Math.sin(th) * ry;
      o.g.strokeStyle = P.stoneDk; o.g.lineWidth = 1;
      o.g.beginPath(); o.g.moveTo(x1 + 0.5 | 0, y1 + 0.5 | 0); o.g.lineTo(x2 + 0.5 | 0, y2 + 0.5 | 0); o.g.stroke();
    }
    return o;
  }

  /* ---------------------------------------------------------------- audio */
  var A = { ctx: null, on: true };

      var t = A.ctx.currentTime, o = A.ctx.createOscillator(), g = A.ctx.createGain();
      o.type = type || "square"; o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(50, f * 0.55), t + d);
      g.gain.setValueAtTime(v || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(A.ctx.destination); o.start(t); o.stop(t + d);
    } catch (e) {}
  }
  function crashSfx() {

      var t = A.ctx.currentTime, len = 0.4;
      var b = A.ctx.createBuffer(1, A.ctx.sampleRate * len, A.ctx.sampleRate), d = b.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      var s = A.ctx.createBufferSource(); s.buffer = b;
      var g = A.ctx.createGain(); g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);

    } catch (e) {}
  }

  /* ---------------------------------------------------------------- rounds */

    planes[0].x = 70; planes[0].y = GROUND + 96; planes[0].vy = 0; planes[0].alive = true; planes[0].home = 70;
    planes[1].alive = false; wing.visible = false;

  function flap() {

  window.addEventListener("keydown", function (e) {

  $("#again").addEventListener("pointerdown", function (e) { e.stopPropagation(); });
  window.addEventListener("resize", resize);

  /* ------------------------------------------------------------------ loop */
  var clock = new THREE.Clock();
  var scoreEl = $("#score"), clearedEl = $("#cleared"), clrEl = $("#clearance"),
      clrChip = $("#clrChip"), x2 = $("#x2Chip");
  var hudT = 0, tickT = 0, pkT = 6;

  function tick() {
    requestAnimationFrame(tick);
    var dt = Math.min(clock.getDelta(), 0.05);
    st.t += dt;
    var fly = st.mode === "fly";
    var hard = Math.min(1, st.score / 4500);
    st.speed = fly ? 78 + hard * 46 : 30;
    var dx = st.speed * dt;

    /* parallax bands */
    layers.forEach(function (L) {
      L.x -= dx * L.speed;
      L.x = ((L.x % L.w) + L.w) % L.w;
      put(L.a, -L.x, L.y);
      put(L.b, -L.x + L.w, L.y);
    });
    clouds.forEach(function (c) {
      c.x -= dx * c.k;

      put(c.m, c.x, c.y);
    });

    /* landmarks */
    var planeX = planes[0].x;
    for (var i = 0; i < VAR.length; i++) {
      var v = VAR[i];

      v.x -= dx;
      put(v.m, v.x, GROUND - 4);

      if (v.x + v.w < -30) { v.live = false; v.m.visible = false; }
    }

    while (frontier < VW + 200) frontier = spawnLandmark(frontier) + ri(46, Math.round(104 - hard * 34));

    /* banner tow aircraft drifting the other way */
    /* the tow plane flies left, so the banner trails off its tail to the right */
    towX -= (st.speed * 0.30 + 14) * dt;
    if (towX < -(62 + banArtO.w)) towX = VW + rnd(40, 260);
    var bob = Math.round(Math.sin(st.t * 1.1) * 2);
    put(towPlane, towX, towY + bob);
    put(rope, towX + 48, towY + bob + 7);
    put(banner, towX + 62, towY + bob + 2 + Math.round(Math.sin(st.t * 2.2)));

    /* pick-up */
    if (fly) {
      pkT -= dt;
      if (pkT <= 0 && !pk.live) {
        pkT = rnd(9, 16);
        pk.live = true; pickM.visible = true;
        pk.x = VW + 40; pk.y = GROUND + rnd(34, 120);
      }
    }
    if (pk.live) {
      pk.x -= dx;
      put(pickM, pk.x, pk.y + Math.round(Math.sin(st.t * 3) * 3));
      if (pk.x < -30) { pk.live = false; pickM.visible = false; }
    }

    /* planes */
    var lowest = Infinity, alive = 0;
    for (i = 0; i < planes.length; i++) {
      var p = planes[i];
      if (!p.alive) { p.m.visible = false; continue; }
      alive++;
      p.m.visible = true;

      if (fly) {
        p.vy -= 330 * dt;
        if (p.vy < -230) p.vy = -230;
        p.y += p.vy * dt;
        p.x += (p.home - p.x) * Math.min(1, dt * 2);
        if (p.y > VH - 22) { p.y = VH - 22; p.vy = Math.min(p.vy, 0); }

        beep(980, 0.16, "triangle", 0.06);
        if (!planes[1].alive) {
          planes[1].alive = true; planes[1].x = p.x - 30; planes[1].y = p.y + 10;
          planes[1].vy = 40; planes[1].home = 40; wing.visible = true;
          $("#x2Chip").hidden = false;
        } else st.score += 350;
      }
    }

    /* scoring: low is good */
    if (fly && lowest !== Infinity) {
      if (lowest >= 0 && lowest < st.closest) st.closest = lowest;
      if (lowest < 24) {
        st.score += (24 - Math.max(0, lowest)) * 3.4 * dt * (planes[1].alive ? 2 : 1);
        tickT += dt;
        if (lowest < 8 && tickT > 0.22) { tickT = 0; beep(1300, 0.035, "sine", 0.022); }
      }
    }

    /* which plane the next tap flies */
    if (fly && planes[1].alive) {
      var lv = planes.filter(function (o) { return o.alive; });
      var act = lv[st.active % lv.length];
      chev.visible = true;
      put(chev, act.x - 4, act.y + 12 + Math.round(Math.sin(st.t * 7)));
    } else chev.visible = false;

    /* HUD */
    hudT -= dt;
    if (hudT <= 0) {
      hudT = 0.06;
      scoreEl.textContent = pad(st.score);
      clearedEl.textContent = st.cleared;
      if (fly && lowest !== Infinity) {
        var m = Math.max(0, lowest) * 0.5;
        clrEl.textContent = m.toFixed(1) + "M";
        clrChip.classList.toggle("hot", m < 2);
      } else { clrEl.innerHTML = "&mdash;"; clrChip.classList.remove("hot"); }
      x2.hidden = !(fly && planes[1].alive);
    }

    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(post, postCam);
  }

  resize();
  resetWorld();
  planes[0].y = GROUND + 96;
  tick();
})();
</script>
</body>
</html>
